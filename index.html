<style>
  /* Layout: three views — onboarding (centered steps), library (level path + book grid), reader (text column + word panel as sidebar ≥1024px or bottom sheet).
     Deliberately single dark theme: deep blue-slate ink with a brass accent, like a reading lamp over a page. */
  :root {
    --bg: #0b0d12;
    --surface: #12151c;
    --raised: #191d26;
    --line: #252a35;
    --fg: #e8e4da;
    --muted: #8a8f9c;
    --accent: #d9ab57;
    --accent-soft: #2a2416;
    --ink: #17120a;
    --ok: #86b8a0;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
  #root { height: 100%; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .prose-reader { font-family: Literata, Georgia, Cambria, serif; font-optical-sizing: auto; line-height: 1.8; hyphens: auto; -webkit-hyphens: auto; }
  .prose-reader p + p { text-indent: 1.6em; }
  .word { cursor: pointer; border-radius: 4px; padding: 0.04em 0.08em; margin: 0 -0.08em; transition: background-color .18s ease, color .18s ease, box-shadow .18s ease; -webkit-user-select: none; user-select: none; }
  @media (hover: hover) { .word:hover { background: var(--raised); } }
  .word.is-saved { text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 0.28em; }
  .word.is-match { background: var(--accent-soft); }
  .word.is-selected { background: var(--accent); color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
  .word:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tnum { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; }
  mark.hl { background: transparent; color: var(--accent); font-weight: 600; }
  .mark-sound { color: var(--accent); text-decoration: underline wavy var(--accent); text-underline-offset: 0.22em; text-decoration-thickness: 1px; }

  .sheet { transition: transform .38s cubic-bezier(.2,.8,.2,1); }
  .side { transition: width .38s cubic-bezier(.2,.8,.2,1); }
  .fade { transition: opacity .3s ease; }
  .bar { transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .rise { animation: rise .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .toast { animation: toast 1.8s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 12%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-4px); } }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .side, .fade, .word, .bar { transition: none !important; }
    .rise, .toast { animation: none !important; }
  }
</style>

  function parseIPA(ipa) {
    const s = ipa.replace(/g/g, 'ɡ');
    const out = [];
    let i = 0, stress = false, brk = false;
    while (i < s.length) {
      const ch = s[i];
      if (ch === 'ˈ') { stress = true; brk = true; i++; continue; }
      if (ch === 'ˌ' || ch === '.') { brk = true; i++; continue; }
      if (ch === 'ː') {

        if (last && VOWELS.has(last.p + 'ː')) last.p += 'ː';
        i++; continue;
      }
      const hit = PHONEMES.find(p => s.startsWith(p, i));
      if (hit) { out.push({ p: hit, stress, brk: brk && out.length > 0 }); stress = false; brk = false; i += hit.length; }
      else i++;

    const nuclei = ph.map((x, i) => (VOWELS.has(x.p) ? i : -1)).filter(i => i >= 0);

    const cuts = [];
    for (let n = 0; n < nuclei.length - 1; n++) {
      const a = nuclei[n], b = nuclei[n + 1];
      let cut = -1;
      for (let k = a + 1; k <= b; k++) if (ph[k].brk) { cut = k; break; }
      if (cut < 0) { const c = b - a - 1; cut = c === 0 ? b : c === 1 ? a + 1 : b - 1; }
      cuts.push(cut);

    const syl = []; let start = 0;
    cuts.forEach(c => { syl.push(ph.slice(start, c)); start = c; });

  }

        let last = 0, m;
        WORD_RE.lastIndex = 0;
        while ((m = WORD_RE.exec(s))) {
          if (m.index > last) tokens.push({ type: 'gap', text: s.slice(last, m.index) });
          tokens.push({ type: 'word', text: m[0], id: `${pi}-${si}-${m.index}` });
          last = m.index + m[0].length;
          words++;

                <h1 className="font-read text-[clamp(1.8rem,5vw,2.6rem)] font-semibold leading-tight">¿Qué español hablas?</h1>
                <p className="max-w-[56ch] text-muted">En España existe un sonido que en Latinoamérica no se usa. Saberlo nos permite darte mejores pistas de pronunciación.</p>
              </div>
              <div className="grid gap-3 sm:grid-cols-2">
                ${[
                  { id: 'LA', title: 'Latinoamérica', sample: 'zapato · cielo', how: 'Suenan con «s»: «sapato», «sielo».', hint: 'Para «th» en inglés te enseñaremos el gesto de la lengua, porque no tienes un sonido equivalente.' },
                  { id: 'ES', title: 'España', sample: 'zapato · cielo', how: 'Suenan con /θ/, la lengua entre los dientes.', hint: 'Usaremos tu «z» como atajo: «think» se parece a «zink».' }
                ].map(v => html`
                  <button key=${v.id} type="button" onClick=${() => set({ variant: v.id })}
                    className=${'flex flex-col gap-3 rounded-2xl border p-5 text-left transition ' + (draft.variant === v.id ? 'border-accent bg-soft' : 'border-line bg-surface hover:border-muted')}>
                    <span className="flex items-center justify-between gap-2">
                      <span className="text-lg font-semibold text-fg">${v.title}</span>
                      ${draft.variant === v.id && html`<span className="text-accent"><${Icon} d=${I.check} /></span>`}
                    </span>
                    <span className="font-read text-2xl italic text-fg">${v.sample}</span>
                    <span className="text-sm text-fg">${v.how}</span>
                    <span className="text-sm leading-relaxed text-muted">${v.hint}</span>
                  </button>`)}
              </div>`}

            ${step === 'target' && html`
              <div className="flex flex-col gap-2">
                <h1 className="font-read text-[clamp(1.8rem,5vw,2.6rem)] font-semibold leading-tight">¿Qué idioma quieres aprender?</h1>
                <p className="max-w-[56ch] text-muted">Puedes cambiarlo cuando quieras desde tu perfil.</p>
              </div>
              <${LangGrid} field="target" disabledCode=${draft.native} highlight=${c => CATALOG[c] && CATALOG[c].some(b => b.readable)} />`}

            ${step === 'level' && html`
              <div className="flex flex-col gap-2">
                <h1 className="font-read text-[clamp(1.8rem,5vw,2.6rem)] font-semibold leading-tight">¿Desde qué nivel empiezas?</h1>
                <p className="max-w-[56ch] text-muted">Te sugeriremos libros de tu nivel. Al leer ganas XP y subes de rango hasta Maestro.</p>
              </div>
              <div className="flex flex-col gap-2">
                ${LEVELS.map((l, i) => html`
                  <button key=${l.code} type="button" onClick=${() => set({ level: i })}
                    className=${'flex items-center gap-4 rounded-xl border px-4 py-3.5 text-left transition ' + (draft.level === i ? 'border-accent bg-soft' : 'border-line bg-surface hover:border-muted')}>
                    <span className=${'grid h-11 w-11 shrink-0 place-items-center rounded-lg font-mono text-sm font-medium ' + (draft.level === i ? 'bg-accent text-ink' : 'bg-raised text-fg')}>${l.code}</span>
                    <span className="flex min-w-0 flex-col">
                      <span className="font-semibold text-fg">${l.rank}</span>
                      <span className="text-sm text-muted">${l.desc}</span>
                    </span>
                  </button>`)}
                <p className="pt-1 text-sm text-muted">¿No lo sabes? Empieza en A1: los textos fáciles se leen rápido y suben tu XP enseguida.</p>
              </div>`}
          </div>
        </div>

        <div className="fixed inset-x-0 bottom-0 z-10 border-t border-line bg-bg" style=${{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
          <div className="gutter mx-auto flex max-w-3xl items-center justify-between gap-3 py-3">
            <button type="button" onClick=${prev} disabled=${idx === 0 && !onCancel}
              className="h-12 rounded-xl px-4 text-sm font-semibold text-muted transition hover:text-fg disabled:opacity-0">
              ${idx === 0 ? 'Cancelar' : 'Atrás'}
            </button>
            <button type="button" disabled=${!canNext} onClick=${idx === steps.length - 1 ? finish : next}
              className="h-12 min-w-[160px] rounded-xl bg-accent px-6 text-[15px] font-semibold text-ink transition hover:brightness-110 disabled:opacity-40">
              ${idx === steps.length - 1 ? (initial ? 'Guardar cambios' : 'Empezar a leer') : 'Continuar'}
            </button>
          </div>
        </div>
      </div>`;
  }

  /* ================================================================== *
   * Library (level path + suggested books)
   * ================================================================== */
  function Library({ profile, rank, xp, streak, vocabCount, finished, onOpenBook, onEditProfile, onOpenVocab }) {
    const [pending, setPending] = useState(null);
    const books = CATALOG[profile.target] || [];
    const lv = LEVELS[rank];
    const pct = rank === 5 ? 100 : Math.round(((xp % XP_PER_LEVEL) / XP_PER_LEVEL) * 100);
    const toNext = rank === 5 ? 0 : XP_PER_LEVEL - (xp % XP_PER_LEVEL);
    const nk = nativeKeyOf(profile);

    const tapBook = b => {
      const locked = b.level > rank + 1;
      if (b.readable && !locked) return onOpenBook(b.id, b.level > rank);
      setPending(pending === b.id ? null : b.id);
    };

    return html`
      <div className="flex h-full flex-col">
        <header className="shrink-0 border-b border-line bg-bg">
          <div className="gutter mx-auto flex max-w-6xl items-center gap-3 py-3">
            <div className="flex shrink-0 items-center gap-2.5">
              <div className="grid h-9 w-9 place-items-center rounded-[10px] bg-accent font-read text-[15px] font-semibold text-ink">S</div>
              <span className="hidden text-[15px] font-semibold tracking-tight min-[520px]:inline">Simart</span>
            </div>
            <div className="ml-auto flex items-center gap-2">
              <${XpPill} rank=${rank} xp=${xp} />
              <button type="button" onClick=${onOpenVocab}
                className="flex h-10 items-center gap-2 rounded-xl border border-line bg-surface px-3 text-sm font-semibold text-fg transition hover:border-muted">
                <${Icon} d=${I.stack} size=${17} /><span className="hidden sm:inline">Vocabulario</span><span className="tnum text-accent">${vocabCount}</span>
              </button>
              <button type="button" onClick=${onEditProfile} aria-label="Editar perfil de idiomas"
                className="flex h-10 items-center gap-1.5 rounded-xl border border-line bg-surface px-3 font-mono text-xs font-medium uppercase text-fg transition hover:border-muted">
                ${profile.native}${profile.native === 'es' ? html`<span className="text-muted">-${profile.variant}</span>` : ''}<span className="text-muted">→</span><span className="text-accent">${profile.target}</span>
              </button>
            </div>
          </div>
        </header>

        <main className="scroll-thin min-h-0 flex-1 overflow-y-auto">
          <div className="gutter mx-auto flex max-w-6xl flex-col gap-10 pb-20 pt-8 sm:pt-12">
            <section className="grid gap-6 lg:grid-cols-[1.4fr_1fr] lg:items-end">
              <div className="flex flex-col gap-3">
                <span className="eyebrow">Tu camino en ${langName(profile.target).toLowerCase()}</span>
                <h1 className="font-read text-[clamp(2rem,5.5vw,3.2rem)] font-semibold leading-[1.05] tracking-tight">
                  Rango ${lv.rank} <span className="font-mono text-[0.55em] font-medium text-accent align-middle">${lv.code}</span>
                </h1>
                <p className="max-w-[52ch] text-muted">${rank === 5 ? 'Has llegado a la cima. Cualquier libro es tuyo.' : `Te faltan ${toNext} XP para ${LEVELS[rank + 1].rank}. Toca palabras nuevas, guárdalas y termina capítulos para subir.`}</p>
              </div>
              <dl className="grid grid-cols-3 gap-3">
                ${[
                  ['XP total', xp, null],
                  ['Racha', streak.days, I.flame],
                  ['Guardadas', vocabCount, null]
                ].map(([label, value, icon]) => html`
                  <div key=${label} className="flex flex-col gap-1 rounded-xl border border-line bg-surface px-4 py-3">
                    <dt className="flex items-center gap-1 text-xs text-muted">${icon && html`<${Icon} d=${icon} size=${13} />`}${label}</dt>
                    <dd className="tnum font-read text-2xl font-semibold">${value}${label === 'Racha' ? html`<span className="text-sm font-normal text-muted"> ${streak.days === 1 ? 'día' : 'días'}</span>` : ''}</dd>
                  </div>`)}
              </dl>
            </section>

            <section className="flex flex-col gap-3" aria-label="Niveles">
              <div className="h-1.5 overflow-hidden rounded-full bg-raised"><div className="bar h-full rounded-full bg-accent" style=${{ width: ((rank + pct / 100) / 6) * 100 + '%' }}></div></div>
              <ol className="no-scrollbar -mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
                ${LEVELS.map((l, i) => {
                  const state = i < rank ? 'done' : i === rank ? 'now' : i === rank + 1 ? 'next' : 'locked';
                  return html`
                    <li key=${l.code} className=${'flex min-w-[118px] flex-1 flex-col gap-1 rounded-xl border px-3 py-2.5 ' + (state === 'now' ? 'border-accent bg-soft' : 'border-line bg-surface')}>
                      <span className="flex items-center justify-between">
                        <span className=${'font-mono text-sm font-medium ' + (state === 'locked' ? 'text-muted' : 'text-fg')}>${l.code}</span>
                        ${state === 'done' && html`<span className="text-ok"><${Icon} d=${I.check} size=${15} /></span>`}
                        ${state === 'locked' && html`<span className="text-muted"><${Icon} d=${I.lock} size=${14} /></span>`}
                      </span>
                      <span className=${'text-xs font-semibold ' + (state === 'now' ? 'text-accent' : 'text-muted')}>${l.rank}</span>
                    </li>`;
                })}
              </ol>
            </section>

            ${books.length === 0 ? html`
              <section className="flex flex-col gap-2 rounded-2xl border border-dashed border-line px-6 py-10">
                <span className="eyebrow">Catálogo en preparación</span>
                <p className="font-read text-xl">Aún no hay libros de ${langName(profile.target).toLowerCase()} en la demo.</p>
                <p className="max-w-[60ch] text-sm text-muted">La versión final cargará títulos de dominio público para cada nivel. Para probar la lectura ahora, cambia el idioma a inglés o francés desde tu perfil.</p>
              </section>` :
              LEVELS.map((l, i) => {
                const levelBooks = books.filter(b => b.level === i);
                if (!levelBooks.length) return null;
                const tag = i < rank ? 'Superado' : i === rank ? 'Tu nivel' : i === rank + 1 ? 'Desafío · +50 % XP' : 'Bloqueado';
                return html`
                  <section key=${l.code} className="flex flex-col gap-4">
                    <div className="flex items-baseline gap-3 border-b border-line pb-2">
                      <h2 className="font-read text-xl font-semibold">${l.code} · ${l.rank}</h2>
                      <span className=${'text-xs font-semibold ' + (i === rank ? 'text-accent' : i === rank + 1 ? 'text-fg' : 'text-muted')}>${tag}</span>
                    </div>
                    <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                      ${levelBooks.map(b => {
                        const locked = b.level > rank + 1;
                        const done = finished.includes(b.id);
                        const open = pending === b.id;
                        return html`
                          <article key=${b.id} className=${'flex flex-col overflow-hidden rounded-2xl border bg-surface transition ' + (open ? 'border-accent' : 'border-line')}>
                            <button type="button" onClick=${() => tapBook(b)} className="flex gap-4 p-4 text-left">
                              <span className=${'relative flex h-[104px] w-[74px] shrink-0 flex-col justify-between overflow-hidden rounded-md p-2 ' + (b.readable ? 'bg-accent text-ink' : 'bg-raised text-fg')}>
                                <span className="font-mono text-[10px] font-medium">${l.code}</span>
                                <span className="font-read text-[11px] font-semibold leading-tight line-clamp-4">${b.title}</span>
                                <span className="flex gap-0.5">${LEVELS.map((_, k) => html`<span key=${k} className=${'h-1 flex-1 rounded-sm ' + (k <= i ? (b.readable ? 'bg-ink' : 'bg-accent') : (b.readable ? 'bg-ink opacity-20' : 'bg-line'))}></span>`)}</span>
                                ${locked && html`<span className="absolute inset-0 grid place-items-center bg-black/60 text-fg"><${Icon} d=${I.lock} /></span>`}
                              </span>
                              <span className="flex min-w-0 flex-1 flex-col gap-1.5">
                                <span className="font-read text-[17px] font-semibold leading-snug text-fg">${b.title}</span>
                                <span className="text-xs text-muted">${b.author} · ${b.year}</span>
                                <span className="text-sm leading-snug text-muted line-clamp-2">${b.blurb}</span>
                                <span className="mt-auto flex flex-wrap gap-1.5 pt-1">
                                  ${done ? html`<${Chip} tone="ok"><${Icon} d=${I.check} size=${12} /> Leído<//>` : b.readable ? html`<${Chip} tone="accent">Leer ahora<//>` : html`<${Chip}>Próximamente<//>`}
                                  ${b.author === LT && html`<${Chip}>Original<//>`}
                                </span>
                              </span>
                            </button>
                            ${open && html`
                              <div className="rise flex flex-col gap-3 border-t border-line px-4 py-3.5">
                                ${b.readable ? html`
                                  <p className="text-sm text-fg">Este libro está por encima de tu nivel. Ábrelo como desafío y ganarás +50 % de XP.</p>
                                  <div className="flex gap-2">
                                    <button type="button" onClick=${() => onOpenBook(b.id, true)} className="h-10 flex-1 rounded-lg bg-accent text-sm font-semibold text-ink">Aceptar desafío</button>
                                    <button type="button" onClick=${() => setPending(null)} className="h-10 rounded-lg border border-line px-4 text-sm font-semibold text-muted">Cancelar</button>
                                  </div>` : html`
                                  <p className="text-sm text-muted">${locked ? `Se desbloquea al llegar a ${LEVELS[b.level - 1].code}. ` : ''}Este título llegará cuando conectemos el catálogo completo de dominio público.</p>`}
                              </div>`}
                          </article>`;
                      })}
                    </div>
                  </section>`;
              })}
            <p className="text-xs text-muted">Pronunciación adaptada para: ${NATIVE_LABEL[nk] || langName(profile.native)}.</p>
          </div>
        </main>
      </div>`;
  }

  /* ================================================================== *
   * Word detail
   * ================================================================== */
  function WordDetail({ lang, selection, profile, prefs, setPrefs, decks, savedItem, onSave }) {
    if (!selection) {
      return html`
        <div className="flex h-full flex-col items-start justify-center gap-3 px-6 py-10">
          <span className="eyebrow">Diccionario contextual</span>
          <p className="font-read text-xl leading-snug text-fg">Toca cualquier palabra del texto.</p>
          <p className="max-w-[34ch] text-sm leading-relaxed text-muted">Verás cómo suena en tu idioma, su traducción, la frase donde aparece, y podrás escucharla más despacio.</p>
        </div>`;
    }
    const entry = lookup(lang, selection.key);
    const nk = nativeKeyOf(profile);
    const sameLang = profile.native === lang;
    const resp = entry && !sameLang ? respell(entry.ipa, nk, lang) : null;
    const rate = prefs.speed;
    const contexts = [
      { label: 'En este libro', src: selection.sentence, es: null },
      entry && { label: 'Otro ejemplo', src: entry.exSrc, es: entry.exEs }
    ].filter(Boolean);

    return html`
      <div key=${selection.id} className="rise flex flex-col gap-6 px-6 pb-8 pt-6">
        <div className="flex flex-col gap-3">
          <div className="flex flex-wrap items-center gap-2">
            ${entry ? html`<${Chip}>${entry.pos}<//>` : html`<${Chip}>sin entrada<//>`}
            ${entry && entry.cefr !== '—' && html`<${Chip} tone="accent">Nivel ${entry.cefr}<//>`}
          </div>
          <h2 className="min-w-0 break-words font-read text-[2.4rem] font-semibold leading-none text-fg">${selection.key}</h2>
          ${entry && html`<p className="font-mono text-sm text-muted">/${entry.ipa}/</p>`}
          ${selection.surface.toLowerCase() !== selection.key && html`
            <p className="text-xs text-muted">Forma en el texto: <span className="font-mono text-fg">${selection.surface}</span></p>`}
        </div>

        ${canSpeak && html`
          <div className="flex flex-wrap items-center gap-2">
            <button type="button" onClick=${() => speak(selection.key, lang, rate)}
              className="flex h-11 items-center gap-2 rounded-xl bg-raised px-4 text-sm font-semibold text-fg transition hover:text-accent" aria-label=${'Escuchar ' + selection.key}>
              <${Icon} d=${I.speaker} /> Escuchar
            </button>
            <button type="button" onClick=${() => speak(selection.key, lang, 0.45)}
              className="flex h-11 items-center gap-2 rounded-xl border border-line px-3 text-sm font-semibold text-muted transition hover:text-fg" aria-label="Escuchar muy despacio">
              <${Icon} d=${I.slow} /> Lento
            </button>
            <${SpeedControl} speed=${prefs.speed} setSpeed=${s => setPrefs({ ...prefs, speed: s })} />
          </div>`}

        ${entry && !sameLang && html`
          <div className="flex flex-col gap-3 rounded-2xl border border-line p-4">
            <div className="flex items-center justify-between gap-2">
              <span className="eyebrow">Cómo suena para ti</span>
              <span className="text-[11px] font-semibold text-muted">${NATIVE_LABEL[nk] || langName(profile.native)}</span>
            </div>
            ${resp ? html`
              <${Respelling} ipa=${entry.ipa} nativeKey=${nk} targetLang=${lang} />
              <p className="text-xs text-muted">Lee en voz alta como en tu idioma. La sílaba subrayada es la fuerte.</p>
              ${resp.tips.length > 0 && html`
                <ul className="flex flex-col gap-2 border-t border-line pt-3">
                  ${resp.tips.map(t => html`
                    <li key=${t.ipa} className="flex gap-3 text-sm leading-relaxed">
                      <span className="w-10 shrink-0 pt-px font-mono text-xs text-accent">/${t.ipa}/</span>
                      <span className="text-fg">${t.text}</span>
                    </li>`)}
                </ul>`}` : html`
              <p className="text-sm text-muted">Aún no tenemos transcripción adaptada para ${langName(profile.native).toLowerCase()}. Usa la fonética IPA y el audio.</p>`}
          </div>`}

        <div className="flex flex-col gap-2 border-y border-line py-5">
          <span className="eyebrow">Traducción</span>
          <p className="font-read text-2xl leading-snug text-accent">${entry ? entry.translation : 'Sin entrada en el diccionario de la demo'}</p>
          ${entry && entry.note && html`<p className="text-sm leading-relaxed text-muted">${entry.note}</p>`}
          ${profile.native !== 'es' && html`<p className="text-xs text-muted">En la demo las traducciones están en español. La versión final las mostrará en ${langName(profile.native).toLowerCase()}.</p>`}
        </div>

        <div className="flex flex-col gap-3">
          <span className="eyebrow">Contexto</span>
          ${contexts.map((c, i) => html`
            <figure key=${i} className="flex flex-col gap-1.5 rounded-xl bg-raised p-4">
              <figcaption className="flex items-center justify-between gap-2 text-[11px] font-semibold uppercase tracking-[0.12em] text-muted">
                ${c.label}
                ${canSpeak && html`<button type="button" onClick=${() => speak(c.src, lang, rate)} className="grid h-8 w-8 place-items-center rounded-lg normal-case text-muted transition hover:text-accent" aria-label="Escuchar frase"><${Icon} d=${I.speaker} size=${16} /></button>`}
              </figcaption>
              <blockquote className="font-read text-[15px] leading-relaxed text-fg"><${Highlight} text=${c.src} term=${selection.surface.length > 1 ? selection.surface : selection.key} /></blockquote>
              ${c.es && html`<p className="text-sm text-muted">${c.es}</p>`}
            </figure>`)}
        </div>

        <div className="flex flex-col gap-3">
          <div className="flex items-baseline justify-between gap-2">
            <span className="eyebrow">${savedItem ? 'Guardada en' : 'Guardar en mi vocabulario'}</span>
            ${savedItem && html`<button type="button" onClick=${() => onSave(null)} className="text-xs font-semibold text-muted underline-offset-2 hover:text-fg hover:underline">Quitar</button>`}
          </div>
          <div className="flex flex-wrap gap-2">
            ${decks.map(d => {
              const active = savedItem && savedItem.deck === d.id;
              return html`
                <button key=${d.id} type="button" onClick=${() => onSave(active ? null : d.id)} aria-pressed=${!!active}
                  className=${'flex min-h-[44px] items-center gap-2 rounded-xl px-3.5 text-sm font-semibold transition ' +
                    (active ? 'bg-accent text-ink' : 'border border-line text-fg hover:border-accent hover:text-accent')}>
                  ${active ? html`<${Icon} d=${I.check} size=${16} />` : html`<${Icon} d=${I.plus} size=${16} />`}${d.name}
                </button>`;
            })}
          </div>
        </div>
      </div>`;
  }

  /* ================================================================== *
   * Saved vocabulary, grouped in practice sections
   * ================================================================== */
  function VocabPanel({ vocab, setVocab, decks, setDecks, profile, rate, onOpen }) {
    const [filter, setFilter] = useState('all');
    const [newName, setNewName] = useState('');
    const nk = nativeKeyOf(profile);
    const items = vocab.filter(v => filter === 'all' || v.deck === filter).slice().sort((a, b) => b.savedAt - a.savedAt);
    const count = id => vocab.filter(v => v.deck === id).length;

    const addDeck = e => {
      e.preventDefault();
      const name = newName.trim();
      if (!name) return;
      const id = 'd' + Date.now().toString(36);
      setDecks([...decks, { id, name }]);
      setFilter(id);
      setNewName('');
    };
    const removeDeck = id => {
      setVocab(vocab.map(v => (v.deck === id ? { ...v, deck: 'later' } : v)));
      setDecks(decks.filter(d => d.id !== id));
      setFilter('all');
    };

    return html`
      <div className="flex flex-col gap-5 px-6 pb-8 pt-5">
        <div className="flex items-start gap-3 rounded-xl bg-raised px-4 py-3">
          <span className="pt-0.5 text-accent"><${Icon} d=${I.stack} size=${16} /></span>
          <p className="text-sm leading-relaxed text-muted"><span className="font-semibold text-fg">Secciones de práctica.</span> Cada sección será un mazo del juego de repaso, que llegará en la próxima versión.</p>
        </div>

        <div className="no-scrollbar -mx-6 flex gap-2 overflow-x-auto px-6">
          ${[{ id: 'all', name: 'Todas' }, ...decks].map(d => html`
            <button key=${d.id} type="button" onClick=${() => setFilter(d.id)}
              className=${'flex h-9 shrink-0 items-center gap-1.5 rounded-lg px-3 text-xs font-semibold transition ' + (filter === d.id ? 'bg-fg text-bg' : 'border border-line text-muted hover:text-fg')}>
              ${d.name}<span className="tnum opacity-70">${d.id === 'all' ? vocab.length : count(d.id)}</span>
            </button>`)}
        </div>

        <form onSubmit=${addDeck} className="flex gap-2">
          <label htmlFor="new-deck" className="sr-only">Nombre de la nueva sección</label>
          <input id="new-deck" value=${newName} onInput=${e => setNewName(e.target.value)} maxLength="32" placeholder="Nueva sección, p. ej. Verbos"
            className="h-10 min-w-0 flex-1 rounded-lg border border-line bg-bg px-3 text-sm text-fg placeholder:text-muted" />
          <button type="submit" disabled=${!newName.trim()} className="flex h-10 items-center gap-1.5 rounded-lg border border-line px-3 text-sm font-semibold text-fg transition hover:border-accent disabled:opacity-40">
            <${Icon} d=${I.plus} size=${16} /> Crear
          </button>
        </form>

        ${filter !== 'all' && !DEFAULT_DECKS.some(d => d.id === filter) && html`
          <button type="button" onClick=${() => removeDeck(filter)} className="self-start text-xs font-semibold text-muted hover:text-fg">Eliminar esta sección (sus palabras pasan a «Repasar más tarde»)</button>`}

        ${items.length === 0 ? html`
          <div className="flex flex-col gap-2 rounded-xl border border-dashed border-line px-5 py-8">
            <p className="font-read text-lg text-fg">No hay palabras aquí todavía.</p>
            <p className="text-sm leading-relaxed text-muted">Toca una palabra mientras lees y elige en qué sección guardarla.</p>
          </div>` : html`
          <ul className="flex flex-col divide-y divide-line">
            ${items.map(v => html`
              <li key=${v.id} className="flex flex-col gap-2 py-3.5">
                <div className="flex items-start gap-2">
                  <button type="button" onClick=${() => onOpen && onOpen(v)} className="group flex min-w-0 flex-1 flex-col items-start gap-0.5 text-left">
                    <span className="flex w-full items-baseline gap-2">
                      <span className="font-read text-lg font-semibold text-fg group-hover:text-accent">${v.key}</span>
                      <span className="ml-auto shrink-0 font-mono text-[10px] uppercase text-muted">${v.lang}</span>
                    </span>
                    ${v.ipa && profile.native !== v.lang && html`<${Respelling} ipa=${v.ipa} nativeKey=${nk} targetLang=${v.lang} size="sm" />`}
                    <span className="text-sm text-accent">${v.translation}</span>
                  </button>
                  ${canSpeak && html`
                    <button type="button" onClick=${() => speak(v.key, v.lang, rate)} aria-label=${'Escuchar ' + v.key}
                      className="grid h-10 w-10 shrink-0 place-items-center rounded-lg text-muted transition hover:bg-raised hover:text-fg"><${Icon} d=${I.speaker} size=${16} /></button>`}
                  <button type="button" onClick=${() => setVocab(vocab.filter(x => x.id !== v.id))} aria-label=${'Quitar ' + v.key}
                    className="grid h-10 w-10 shrink-0 place-items-center rounded-lg text-muted transition hover:bg-raised hover:text-fg"><${Icon} d=${I.trash} size=${16} /></button>
                </div>
                <p className="line-clamp-2 font-read text-[13px] leading-snug text-muted"><${Highlight} text=${v.context} term=${v.surface} /></p>
                <label className="flex items-center gap-2 text-xs text-muted">
                  Sección
                  <select id=${'deck-' + v.id} value=${v.deck} onChange=${e => setVocab(vocab.map(x => (x.id === v.id ? { ...x, deck: e.target.value } : x)))}
                    className="h-8 rounded-md border border-line bg-bg px-2 text-xs font-semibold text-fg">
                    ${decks.map(d => html`<option key=${d.id} value=${d.id}>${d.name}</option>`)}
                  </select>
                </label>
              </li>`)}
          </ul>`}
      </div>`;
  }

  /* ================================================================== *
   * Panel shell & hosts
   * ================================================================== */
  function PanelShell({ tabs, tab, setTab, onClose, children }) {
    return html`
      <div className="flex h-full flex-col bg-surface">
        <div className="flex items-center gap-2 border-b border-line px-4 py-3">
          ${tabs.length > 1 ? html`
            <div className="flex flex-1 rounded-xl bg-bg p-1 text-sm font-semibold" role="tablist">
              ${tabs.map(t => html`
                <button key=${t.id} type="button" role="tab" aria-selected=${tab === t.id} onClick=${() => setTab(t.id)}
                  className=${'flex flex-1 items-center justify-center gap-2 rounded-lg px-3 py-2 transition ' + (tab === t.id ? 'bg-raised text-fg' : 'text-muted hover:text-fg')}>
                  ${t.label}${t.count != null && html`<span className="tnum rounded-full bg-soft px-1.5 text-[11px] text-accent">${t.count}</span>`}
                </button>`)}
            </div>` : html`<span className="flex-1 px-1 font-semibold">${tabs[0].label}</span>`}
          <button type="button" onClick=${onClose} aria-label="Cerrar panel"
            className="grid h-10 w-10 place-items-center rounded-xl text-muted transition hover:bg-raised hover:text-fg"><${Icon} d=${I.close} /></button>
        </div>
        <div className="scroll-thin min-h-0 flex-1 overflow-y-auto overscroll-contain">${children}</div>
      </div>`;
  }

  function BottomSheet({ open, onClose, children, full }) {
    return html`
      <div className=${'fade fixed inset-0 z-30 bg-black/60 ' + (full ? '' : 'lg:hidden ') + (open ? 'opacity-100' : 'pointer-events-none opacity-0')} onClick=${onClose} aria-hidden="true"></div>
      <section className=${'sheet fixed inset-x-0 bottom-0 z-40 mx-auto flex h-[78dvh] max-w-2xl flex-col overflow-hidden rounded-t-[22px] border border-b-0 border-line bg-surface ' +
          (full ? 'lg:inset-y-0 lg:left-auto lg:right-0 lg:mx-0 lg:h-full lg:w-[420px] lg:max-w-none lg:rounded-none lg:border-y-0 lg:border-r-0 ' : 'lg:hidden ') +
          (open ? 'translate-y-0 lg:translate-x-0' : 'translate-y-[105%] ' + (full ? 'lg:translate-y-0 lg:translate-x-full' : ''))}
        style=${{ paddingBottom: 'env(safe-area-inset-bottom, 0px)', paddingRight: 'env(safe-area-inset-right, 0px)' }}
        aria-hidden=${!open}>
        <div className=${'flex justify-center pt-2.5 ' + (full ? 'lg:hidden' : '')}><span className="h-1 w-10 rounded-full bg-line"></span></div>
        <div className="min-h-0 flex-1">${children}</div>
      </section>`;
  }

  /* ================================================================== *
   * Reader
   * ================================================================== */
  function Reader({ bookId, profile, prefs, setPrefs, vocab, setVocab, decks, setDecks, looked, setLooked, finished, award, onFinish, onBack, rank, xp, challenge }) {
    const book = BOOKS[bookId];
    const meta = findMeta(bookId);
    const lang = book.lang;
    const [selection, setSelection] = useState(null);
    const [panelOpen, setPanelOpen] = useState(false);
    const [tab, setTab] = useState('word');
    const [progress, setProgress] = useState(0);
    const scrollRef = useRef(null);
    const parsed = useMemo(() => parseBook(book.paragraphs), [book]);
    const uniqueKeys = useMemo(() => {
      const s = new Set();
      parsed.paragraphs.forEach(p => p.forEach(sn => sn.tokens.forEach(t => t.type === 'word' && s.add(toKey(t.text, lang)))));
      return s;
    }, [parsed, lang]);
    const savedKeys = useMemo(() => new Set(vocab.filter(v => v.lang === lang).map(v => v.key)), [vocab, lang]);
    const isDone = finished.includes(bookId);

    const measure = useCallback(() => {
      const el = scrollRef.current;
      if (!el) return;
      const max = el.scrollHeight - el.clientHeight;
      setProgress(max <= 2 ? 1 : Math.min(1, el.scrollTop / max));
    }, []);
    useEffect(() => {
      measure();
      window.addEventListener('resize', measure);
      return () => window.removeEventListener('resize', measure);
    }, [prefs.size, panelOpen, measure]);
    useEffect(() => {
      const onKey = e => { if (e.key === 'Escape') setPanelOpen(false); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);

    const selectWord = (token, sentence) => {
      const key = toKey(token.text, lang);
      setSelection({ id: token.id, key, surface: token.text, sentence });
      setTab('word');
      setPanelOpen(true);
      if (prefs.autoplay) speak(key, lang, prefs.speed);
      const lk = `${lang}:${key}`;
      if (!looked.includes(lk) && lookup(lang, key)) { setLooked([...looked, lk]); award(2, 'palabra nueva'); }
    };

    const savedItem = selection ? vocab.find(v => v.id === `${lang}:${selection.key}`) : null;
    const onSave = deckId => {
      if (!selection) return;
      const id = `${lang}:${selection.key}`;
      if (deckId == null) { setVocab(vocab.filter(v => v.id !== id)); return; }
      if (savedItem) { setVocab(vocab.map(v => (v.id === id ? { ...v, deck: deckId } : v))); return; }
      const entry = lookup(lang, selection.key);
      setVocab([...vocab, {
        id, lang, key: selection.key, surface: selection.surface, deck: deckId,
        ipa: entry ? entry.ipa : '', translation: entry ? entry.translation : 'Traducción pendiente',
        pos: entry ? entry.pos : '', context: selection.sentence, book: meta.title, savedAt: Date.now()
      }]);
      award(5, 'palabra guardada');
    };

    const openFromVocab = v => {
      if (v.lang !== lang) return speak(v.key, v.lang, prefs.speed);
      setSelection({ id: 'vocab-' + v.id, key: v.key, surface: v.surface, sentence: v.context });
      setTab('word');
    };

    const toggleVocab = () => {
      if (panelOpen && tab === 'vocab') setPanelOpen(false);
      else { setTab('vocab'); setPanelOpen(true); }
    };

    const chapterPct = Math.round(progress * 100);
    const lvl = LEVELS[meta.level];

    const panel = html`
      <${PanelShell} tabs=${[{ id: 'word', label: 'Palabra' }, { id: 'vocab', label: 'Vocabulario', count: vocab.length }]} tab=${tab} setTab=${setTab} onClose=${() => setPanelOpen(false)}>
        ${tab === 'word'
          ? html`<${WordDetail} lang=${lang} selection=${selection} profile=${profile} prefs=${prefs} setPrefs=${setPrefs} decks=${decks} savedItem=${savedItem} onSave=${onSave} />`
          : html`<${VocabPanel} vocab=${vocab} setVocab=${setVocab} decks=${decks} setDecks=${setDecks} profile=${profile} rate=${prefs.speed} onOpen=${openFromVocab} />`}
      <//>`;

    return html`
      <div className="flex h-full flex-col">
        <header className="relative z-20 shrink-0 border-b border-line bg-bg">
          <div className="gutter flex items-center gap-2 py-3 sm:gap-4">
            <button type="button" onClick=${onBack} aria-label="Volver a la biblioteca"
              className="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-line bg-surface text-fg transition hover:border-muted"><${Icon} d=${I.back} /></button>

            <div className="hidden min-w-0 flex-1 flex-col gap-1.5 md:flex">
              <div className="flex items-baseline gap-2 text-sm">
                <span className="truncate font-read italic text-fg">${meta.title}</span>
                <span className="shrink-0 text-muted">·</span>
                <span className="tnum shrink-0 text-muted">Cap. ${ROMAN[book.chapterIndex]} · ${chapterPct} %</span>
                ${challenge && html`<span className="shrink-0 text-xs font-semibold text-accent">Desafío ×1,5</span>`}
              </div>
              <div className="h-1 w-full max-w-md overflow-hidden rounded-full bg-raised" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${chapterPct} aria-label="Progreso del capítulo">
                <div className="bar h-full rounded-full bg-accent" style=${{ width: chapterPct + '%' }}></div>
              </div>
            </div>

            <div className="ml-auto flex items-center gap-2">
              <div className="hidden min-[560px]:block"><${XpPill} rank=${rank} xp=${xp} /></div>
              <div className="flex h-10 items-center rounded-xl border border-line bg-surface" role="group" aria-label="Tamaño de letra">
                <button type="button" onClick=${() => setPrefs({ ...prefs, size: Math.max(0, prefs.size - 1) })} disabled=${prefs.size === 0}
                  className="h-full px-3 font-read text-sm text-fg transition hover:text-accent disabled:opacity-30" aria-label="Reducir letra">A</button>
                <span className="h-5 w-px bg-line"></span>
                <button type="button" onClick=${() => setPrefs({ ...prefs, size: Math.min(SIZES.length - 1, prefs.size + 1) })} disabled=${prefs.size === SIZES.length - 1}
                  className="h-full px-3 font-read text-lg leading-none text-fg transition hover:text-accent disabled:opacity-30" aria-label="Aumentar letra">A</button>
              </div>
              <button type="button" onClick=${() => setPrefs({ ...prefs, autoplay: !prefs.autoplay })} aria-pressed=${prefs.autoplay}
                title=${prefs.autoplay ? 'Sonido al tocar: activado' : 'Sonido al tocar: desactivado'}
                className=${'grid h-10 w-10 place-items-center rounded-xl border transition ' + (prefs.autoplay ? 'border-accent bg-soft text-accent' : 'border-line bg-surface text-muted')}
                aria-label="Reproducir sonido al tocar una palabra"><${Icon} d=${I.speaker} size=${17} /></button>
              <button type="button" onClick=${toggleVocab} aria-pressed=${panelOpen && tab === 'vocab'}
                className=${'flex h-10 items-center gap-2 rounded-xl border px-3 text-sm font-semibold transition ' +
                  (panelOpen && tab === 'vocab' ? 'border-accent bg-soft text-accent' : 'border-line bg-surface text-fg hover:border-muted')}>
                <${Icon} d=${I.stack} size=${17} /><span className="tnum text-accent">${vocab.length}</span>
              </button>
            </div>
          </div>
          <div className="absolute inset-x-0 bottom-0 h-[2px] md:hidden"><div className="bar h-full bg-accent" style=${{ width: chapterPct + '%' }}></div></div>
        </header>

        <div className="flex min-h-0 flex-1">
          <main ref=${scrollRef} onScroll=${measure} className="scroll-thin min-w-0 flex-1 overflow-y-auto">
            <article className="gutter mx-auto w-full max-w-[44rem] pb-24 pt-10 sm:pt-14">
              <div className="mb-10 flex flex-col gap-3">
                <span className="eyebrow">${lvl.code} · ${lvl.rank} · Capítulo ${ROMAN[book.chapterIndex]} de ${ROMAN[book.chapters - 1]}</span>
                <h1 className="font-read text-[clamp(1.9rem,5vw,2.75rem)] font-semibold leading-[1.1] tracking-tight">${book.chapterTitle}</h1>
                <p className="text-sm text-muted">${meta.title} · ${meta.author} · ${meta.year}</p>
              </div>

              <div className="prose-reader flex flex-col text-fg" style=${{ fontSize: SIZES[prefs.size] + 'px' }} lang=${lang}>
                ${parsed.paragraphs.map((sentences, pi) => html`
                  <p key=${pi}>
                    ${sentences.map(s => s.tokens.map(t => {
                      if (t.type === 'gap') return t.text;
                      const k = toKey(t.text, lang);
                      const isSel = selection && selection.id === t.id;
                      const cls = ['word', isSel && 'is-selected', !isSel && selection && selection.key === k && 'is-match', savedKeys.has(k) && 'is-saved'].filter(Boolean).join(' ');
                      return html`<span key=${t.id} role="button" tabIndex="0" className=${cls}
                        onClick=${() => selectWord(t, s.text)}
                        onKeyDown=${e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectWord(t, s.text); } }}>${t.text}</span>`;
                    }))}
                  </p>`)}
              </div>

              <footer className="mt-14 flex flex-col gap-5 border-t border-line pt-6">
                <span className="eyebrow">Fin del fragmento de muestra</span>
                <dl className="grid grid-cols-3 gap-4">
                  ${[['Palabras', parsed.words], ['Únicas', uniqueKeys.size], ['Guardadas', [...savedKeys].filter(k => uniqueKeys.has(k)).length]].map(([label, value]) => html`
                    <div key=${label} className="flex flex-col gap-1">
                      <dt className="text-xs text-muted">${label}</dt>
                      <dd className="tnum font-read text-2xl font-semibold">${value}</dd>
                    </div>`)}
                </dl>
                <button type="button" disabled=${isDone} onClick=${() => onFinish(bookId)}
                  className=${'flex h-12 items-center justify-center gap-2 rounded-xl text-[15px] font-semibold transition ' + (isDone ? 'border border-line text-ok' : 'bg-accent text-ink hover:brightness-110')}>
                  ${isDone ? html`<${Icon} d=${I.check} /> Capítulo completado` : `Marcar capítulo como leído · +${challenge ? 60 : 40} XP`}
                </button>
              </footer>
            </article>
          </main>

          <aside className="side hidden shrink-0 overflow-hidden border-l border-line lg:block" style=${{ width: panelOpen ? 400 : 0, borderLeftWidth: panelOpen ? 1 : 0 }} aria-hidden=${!panelOpen}>
            <div className="h-full w-[400px]">${panel}</div>
          </aside>
        </div>

        <${BottomSheet} open=${panelOpen} onClose=${() => setPanelOpen(false)}>${panel}<//>
      </div>`;
  }

  /* ================================================================== *
   * App
   * ================================================================== */
  function App() {
    const [profile, setProfile] = usePersist('lt.profile', null);
    const [view, setView] = useState(() => (store.get('lt.profile', null) ? 'library' : 'onboarding'));
    const [bookId, setBookId] = useState(null);
    const [challenge, setChallenge] = useState(false);
    const [vocab, setVocab] = usePersist('lt.vocab.v2', []);
    const [decks, setDecks] = usePersist('lt.decks', DEFAULT_DECKS);
    const [xp, setXp] = usePersist('lt.xp', 0);
    const [looked, setLooked] = usePersist('lt.looked', []);
    const [finished, setFinished] = usePersist('lt.finished', []);
    const [streak, setStreak] = usePersist('lt.streak', { days: 0, last: null });
    const [prefs, setPrefs] = usePersist('lt.prefs', { speed: 1, autoplay: true, size: 1 });
    const [vocabOpen, setVocabOpen] = useState(false);
    const [toast, setToast] = useState(null);

    const rank = rankFor(profile, xp);

    useEffect(() => {
      if (!toast) return;
      const t = setTimeout(() => setToast(null), 1800);
      return () => clearTimeout(t);
    }, [toast]);

    const award = useCallback((base, label) => {
      const amount = Math.round(base * (challenge && view === 'reader' ? 1.5 : 1));
      const before = rankFor(profile, xp);
      const after = rankFor(profile, xp + amount);
      setXp(xp + amount);
      setToast(after > before
        ? { id: Date.now(), xp: `¡Subiste a ${LEVELS[after].code}!`, text: LEVELS[after].rank }
        : { id: Date.now(), xp: `+${amount} XP`, text: label });
      const d = today();
      if (streak.last !== d) setStreak({ days: streak.last === yesterday() ? streak.days + 1 : 1, last: d });
    }, [challenge, view, profile, xp, streak]);

    const onFinish = id => {
      if (finished.includes(id)) return;
      setFinished([...finished, id]);
      award(40, 'capítulo completado');
    };

    let content;
    if (view === 'onboarding' || !profile) {
      content = html`<${Onboarding} initial=${profile} onCancel=${profile ? () => setView('library') : null}
        onDone=${p => { setProfile(p); setView('library'); }} />`;
    } else if (view === 'reader' && bookId) {
      content = html`<${Reader} bookId=${bookId} profile=${profile} prefs=${prefs} setPrefs=${setPrefs}
        vocab=${vocab} setVocab=${setVocab} decks=${decks} setDecks=${setDecks}
        looked=${looked} setLooked=${setLooked} finished=${finished} award=${award} onFinish=${onFinish}
        rank=${rank} xp=${xp} challenge=${challenge} onBack=${() => setView('library')} />`;
    } else {
      content = html`
        <${Library} profile=${profile} rank=${rank} xp=${xp} streak=${streak} vocabCount=${vocab.length} finished=${finished}
          onOpenBook=${(id, isChallenge) => { setBookId(id); setChallenge(isChallenge); setView('reader'); }}
          onEditProfile=${() => setView('onboarding')} onOpenVocab=${() => setVocabOpen(true)} />
        <${BottomSheet} open=${vocabOpen} onClose=${() => setVocabOpen(false)} full=${true}>
          <${PanelShell} tabs=${[{ id: 'vocab', label: 'Mi vocabulario' }]} tab="vocab" setTab=${() => {}} onClose=${() => setVocabOpen(false)}>
            <${VocabPanel} vocab=${vocab} setVocab=${setVocab} decks=${decks} setDecks=${setDecks} profile=${profile} rate=${prefs.speed} />
          <//>
        <//>`;
    }

    return html`${content}<${Toast} toast=${toast} />`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body>
</html>
